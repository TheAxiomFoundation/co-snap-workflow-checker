format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ny/regulation/18-nycrr-387/387.8
  summary: |-
    Application procedures must identify households entitled to expedited service. For households entitled to expedited processing of their applications, SNAP benefits must be made available to the household as soon as practicable but no later than the seventh calendar day following the day the application was filed.
rules:
  - name: expedited_service_benefit_availability_calendar_day_limit
    kind: parameter
    dtype: Count
    source: 18 NYCRR section 387.8(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.8
              excerpt: "no later than the seventh calendar day following the day the application was filed"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          7

  - name: expedited_service_household_benefits_available_timely
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 18 NYCRR section 387.8(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.8
          - path: versions[0].formula
            kind: import
            import:
              target: us-ny:regulations/18-nycrr-387/387.8#expedited_service_benefit_availability_calendar_day_limit
              output: expedited_service_benefit_availability_calendar_day_limit
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          (not household_entitled_to_expedited_service)
          or (
              benefits_available_to_household
              and calendar_days_following_application_before_benefits_available <= expedited_service_benefit_availability_calendar_day_limit
          )
