format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ny/regulation/18-nycrr-387/387.7
  summary: |-
    Applicant households must have interviews conducted at initial certification and at least once every twelve months thereafter, except that households in which all adults are elderly or disabled must be interviewed at initial certification and at least once every twenty-four months. The individual interviewed may be the head of household, spouse, any responsible member of the household, or an authorized representative. When a household fails to attend a scheduled interview for an initial eligibility determination, the social services district must send the household a notice of missed interview informing the household of its responsibility to reschedule the interview.
rules:
  - name: initial_and_periodic_interview_month_limit
    kind: parameter
    dtype: Count
    source: 18 NYCRR section 387.7(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.7
              excerpt: "at initial certification and at least once every 12 months"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          12

  - name: elderly_disabled_household_interview_month_limit
    kind: parameter
    dtype: Count
    source: 18 NYCRR section 387.7(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.7
              excerpt: "at least once every 24 months"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          24

  - name: applicant_household_interview_requirement_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 18 NYCRR section 387.7(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.7
          - path: versions[0].formula
            kind: import
            import:
              target: us-ny:regulations/18-nycrr-387/387.7#initial_and_periodic_interview_month_limit
              output: initial_and_periodic_interview_month_limit
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          household_interviewed_before_initial_certification
          and months_since_last_household_interview <= initial_and_periodic_interview_month_limit

  - name: interview_participant_is_permitted_person
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 18 NYCRR section 387.7(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.7
              excerpt: "The individual interviewed may be the head of household, spouse, any responsible member of the household or an authorized representative."
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          interviewed_person_is_head_of_household
          or interviewed_person_is_spouse
          or interviewed_person_is_other_responsible_household_member
          or interviewed_person_is_authorized_representative

  - name: missed_interview_notice_compliant
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 18 NYCRR section 387.7(g)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ny/regulation/18-nycrr-387/387.7
              excerpt: "a notice of missed interview informing the household of its responsibility to reschedule the interview"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          household_failed_to_attend_scheduled_interview
          and district_sent_notice_of_missed_interview_to_household
          and notice_informed_household_responsible_for_rescheduling_interview
